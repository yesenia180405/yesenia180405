# Vuelve a dibujar el perfil.
#
# - Cada día, para que la actividad y los lenguajes estén al día.
# - Al cambiar datos/perfil.json, los scripts o los recursos, para que el
#   cambio se vea sin tener que generar nada a mano.
#
# Los lenguajes salen solo de los repositorios PÚBLICOS, a propósito.
#
# Las contribuciones privadas (repos de la empresa) necesitan el secreto
# PERFIL_TOKEN: un token personal con permiso "repo". Si no está, se usan los
# recuentos guardados en datos/privadas.json la última vez.
name: Perfil

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - "datos/**"
      - "scripts/**"
      - "assets/fuentes/**"
      - "assets/capturas/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: false

jobs:
  dibujar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Tarjetas, banner y README
        run: |
          node scripts/fichas.mjs
          node scripts/banner.mjs
          node scripts/readme.mjs

      - name: Actividad y colaboraciones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL_TOKEN: ${{ secrets.PERFIL_TOKEN }}
        run: |
          node scripts/actividad.mjs
          node scripts/colaboraciones.mjs

      - name: Guardar si ha cambiado algo
        run: |
          git add assets README.md datos/privadas.json
          if git diff --cached --quiet; then
            echo "Nada que actualizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: perfil actualizado"
          git push
