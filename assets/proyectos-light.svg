<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="64" viewBox="0 0 860 64" role="img" aria-labelledby="titulo desc"><title id="titulo">Proyectos</title><desc id="desc">Proyectos destacados</desc><style>@font-face{font-family:'YT Mono 500';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'YT Mono 400';src:url(data:font/woff2;base64,) format('woff2')}.mono500{font-family:'YT Mono 500',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500}.mono400{font-family:'YT Mono 400',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400}@keyframes parpadeo{0%,100%{opacity:1}50%{opacity:0}}.cursor{animation:parpadeo 1.1s steps(1) infinite}@keyframes latido{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}.latido{transform-box:fill-box;transform-origin:center;animation:latido 2s ease-out infinite}@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.entra{animation:entra .7s ease-out both}@media (prefers-reduced-motion:reduce){.cursor,.latido,.entra{animation:none}}</style><rect x=".5" y=".5" width="859" height="63" rx="18" fill="#fdfbff" stroke="#e4d9f7"/><defs><linearGradient id="gP" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs><rect x="32" y="0" width="160" height="2" rx="1" fill="url(#gP)"/><text x="32" y="37" class="mono500" font-size="13" xml:space="preserve"><tspan fill="#b9acd6">&lt;</tspan><tspan fill="#7c3aed">Proyectos</tspan><tspan fill="#b9acd6"> /&gt;</tspan></text><text x="828" y="37" class="mono400" font-size="12" fill="#675d80" text-anchor="end">pulsa una tarjeta para abrir la web</text></svg>